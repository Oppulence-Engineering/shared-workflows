# Copy to the application repository's .github/workflows/ directory.
# Add application quality gates and make this job depend on them before production use.
name: Deploy to DigitalOcean App Platform

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".do/app.yaml"
      - ".github/workflows/deploy-app-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: Oppulence-Engineering/shared-workflows/.github/workflows/digitalocean-app-platform.yml@494800aadf48fe32f947159ec865d3f0c2886193
    with:
      app_id: ${{ vars.DO_APP_ID }}
      app_spec_path: .do/app.yaml
      deploy_ref: refs/heads/main
      environment: production
      # Optional settings (defaults are shown):
      # runner: ubuntu-latest
      # doctl_version: 1.180.0
      # timeout_minutes: 60
      # source_revision_policy: exact
      # require_image_digests: true
      # healthcheck_url: https://example.com/health
      # healthcheck_attempts: 12
      # healthcheck_interval_seconds: 5
      # healthcheck_timeout_seconds: 10
    secrets:
      digitalocean_token: ${{ secrets.DIGITALOCEAN_APP_PLATFORM_TOKEN }}
