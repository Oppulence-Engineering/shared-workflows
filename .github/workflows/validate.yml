name: Validate shared workflows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - name: Lint reusable workflow and example caller
        # actionlint v1.7.12 predates GitHub's documented job.workflow_* contexts.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -ignore 'property "workflow_(repository|sha)" is not defined' .github/workflows/*.yml examples/caller.yml
      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
      - name: Test deployment validation and verification
        run: ruby test/app_platform_test.rb
