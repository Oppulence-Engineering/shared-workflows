name: Reusable DigitalOcean App Platform deployment

on:
  workflow_call:
    inputs:
      app_id:
        description: Existing App Platform app UUID
        required: true
        type: string
      app_spec_path:
        description: Complete app spec path relative to the caller
        required: true
        type: string
      deploy_ref:
        description: Authorized full Git branch or tag ref
        required: true
        type: string
      environment:
        description: Caller GitHub environment for deployment rules
        required: true
        type: string
      runner:
        description: Runner label for both jobs
        type: string
        default: ubuntu-latest
      doctl_version:
        description: Pinned doctl version
        type: string
        default: 1.180.0
      timeout_minutes:
        description: Deploy timeout from 5 to 360 minutes
        type: number
        default: 60
      source_revision_policy:
        description: exact verifies deployed SHA; branch verifies repo and branch; off permits other sources
        type: string
        default: exact
      require_image_digests:
        description: Require sha256 image digests instead of mutable tags
        type: boolean
        default: true
      build_image:
        description: Build and push one image in GitHub, then pin matching placeholders; other images must already have digests
        type: boolean
        default: false
      image_registry_type:
        description: GHCR or DOCR when build_image is true
        type: string
        default: GHCR
      image_registry:
        description: GHCR organization or DigitalOcean registry name
        type: string
        default: ''
      image_repository:
        description: Image repository name within the registry
        type: string
        default: ''
      dockerfile_path:
        description: Dockerfile path relative to the caller repository
        type: string
        default: Dockerfile
      build_context:
        description: Docker build context relative to the caller repository
        type: string
        default: .
      build_target:
        description: Optional Dockerfile stage to build
        type: string
        default: ''
      build_args:
        description: Optional newline-delimited Docker build arguments; never put secrets here
        type: string
        default: ''
      healthcheck_url:
        description: Optional HTTPS URL polled after deployment
        type: string
        default: ''
      healthcheck_attempts:
        description: Maximum health check attempts from 1 to 100
        type: number
        default: 12
      healthcheck_interval_seconds:
        description: Delay between attempts from 0 to 300 seconds
        type: number
        default: 5
      healthcheck_timeout_seconds:
        description: Per-request timeout from 1 to 120 seconds
        type: number
        default: 10
      infisical_identity_id:
        description: OIDC machine identity UUID; leave empty to disable Infisical
        type: string
        default: ''
      infisical_project_id:
        description: Infisical project UUID containing this app's secrets
        type: string
        default: ''
      infisical_environment:
        description: Infisical environment slug
        type: string
        default: prod
      infisical_secret_path:
        description: Infisical folder containing only this app's deployment secrets
        type: string
        default: /
      infisical_domain:
        description: Infisical instance URL
        type: string
        default: https://app.infisical.com
    secrets:
      digitalocean_token:
        description: DigitalOcean token; optional when Infisical provides DIGITALOCEAN_TOKEN
        required: false
    outputs:
      deployment_id:
        description: Verified active deployment ID
        value: ${{ jobs.deploy.outputs.deployment_id }}
      app_url:
        description: App Platform live URL if available
        value: ${{ jobs.deploy.outputs.app_url }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Check authorized ref
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
        run: |
          if [[ "$GITHUB_REF" != "$DEPLOY_REF" || "$DEPLOY_REF" != refs/heads/* && "$DEPLOY_REF" != refs/tags/* ]]; then
            echo "::error::Expected an authorized branch or tag ref; got $GITHUB_REF"
            exit 1
          fi
      - name: Check out caller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: app
          persist-credentials: false
      - name: Check out this workflow's exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: shared
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
      - name: Validate configuration and app spec
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_SPEC_PATH: ${{ inputs.app_spec_path }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          DOCTL_VERSION: ${{ inputs.doctl_version }}
          DEPLOY_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          SOURCE_REVISION_POLICY: ${{ inputs.source_revision_policy }}
          REQUIRE_IMAGE_DIGESTS: ${{ inputs.require_image_digests }}
          BUILD_IMAGE: ${{ inputs.build_image }}
          IMAGE_REGISTRY_TYPE: ${{ inputs.image_registry_type }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}
          HEALTHCHECK_ATTEMPTS: ${{ inputs.healthcheck_attempts }}
          HEALTHCHECK_INTERVAL_SECONDS: ${{ inputs.healthcheck_interval_seconds }}
          HEALTHCHECK_TIMEOUT_SECONDS: ${{ inputs.healthcheck_timeout_seconds }}
          INFISICAL_IDENTITY_ID: ${{ inputs.infisical_identity_id }}
          INFISICAL_PROJECT_ID: ${{ inputs.infisical_project_id }}
          INFISICAL_ENVIRONMENT: ${{ inputs.infisical_environment }}
          INFISICAL_SECRET_PATH: ${{ inputs.infisical_secret_path }}
          INFISICAL_DOMAIN: ${{ inputs.infisical_domain }}
        run: ruby shared/scripts/app_platform.rb validate app

  deploy:
    needs: validate
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: do-app-${{ github.repository }}-${{ inputs.app_id }}
      cancel-in-progress: false
    outputs:
      deployment_id: ${{ steps.verify.outputs.deployment_id }}
      app_url: ${{ steps.verify.outputs.app_url }}
    steps:
      - name: Check out caller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: app
          persist-credentials: false
      - name: Check out this workflow's exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: shared
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: '3.3'
      - name: Revalidate after environment approval
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_SPEC_PATH: ${{ inputs.app_spec_path }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          DOCTL_VERSION: ${{ inputs.doctl_version }}
          DEPLOY_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          SOURCE_REVISION_POLICY: ${{ inputs.source_revision_policy }}
          REQUIRE_IMAGE_DIGESTS: ${{ inputs.require_image_digests }}
          BUILD_IMAGE: ${{ inputs.build_image }}
          IMAGE_REGISTRY_TYPE: ${{ inputs.image_registry_type }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}
          HEALTHCHECK_ATTEMPTS: ${{ inputs.healthcheck_attempts }}
          HEALTHCHECK_INTERVAL_SECONDS: ${{ inputs.healthcheck_interval_seconds }}
          HEALTHCHECK_TIMEOUT_SECONDS: ${{ inputs.healthcheck_timeout_seconds }}
          INFISICAL_IDENTITY_ID: ${{ inputs.infisical_identity_id }}
          INFISICAL_PROJECT_ID: ${{ inputs.infisical_project_id }}
          INFISICAL_ENVIRONMENT: ${{ inputs.infisical_environment }}
          INFISICAL_SECRET_PATH: ${{ inputs.infisical_secret_path }}
          INFISICAL_DOMAIN: ${{ inputs.infisical_domain }}
        run: ruby shared/scripts/app_platform.rb validate app
      - name: Confirm branch still points to caller commit
        if: inputs.source_revision_policy == 'exact'
        working-directory: app
        env:
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_REF" == refs/heads/* ]]; then
            askpass="$(mktemp)"
            trap 'rm -f "$askpass"' EXIT
            cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_READ_TOKEN" ;;
          esac
          ASKPASS
            chmod 700 "$askpass"
            remote_sha="$(GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code origin "$DEPLOY_REF" | cut -f1)"
            if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Branch moved since this run started; deploy its current head"
              exit 1
            fi
          fi
      - name: Fetch scoped secrets from Infisical
        if: inputs.infisical_identity_id != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ inputs.infisical_identity_id }}
          domain: ${{ inputs.infisical_domain }}
          project-id: ${{ inputs.infisical_project_id }}
          env-slug: ${{ inputs.infisical_environment }}
          secret-path: ${{ inputs.infisical_secret_path }}
          include-imports: 'false'
          recursive: 'false'
      - name: Require a DigitalOcean token
        env:
          DO_TOKEN: ${{ secrets.digitalocean_token || env.DIGITALOCEAN_TOKEN }}
        run: |
          if [[ -z "$DO_TOKEN" ]]; then
            echo '::error::Provide digitalocean_token or Infisical DIGITALOCEAN_TOKEN'
            exit 1
          fi
      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.digitalocean_token || env.DIGITALOCEAN_TOKEN }}
          version: ${{ inputs.doctl_version }}
      - name: Log in to GitHub Container Registry
        if: inputs.build_image && inputs.image_registry_type == 'GHCR'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to DigitalOcean Container Registry
        if: inputs.build_image && inputs.image_registry_type == 'DOCR'
        run: doctl registry login --expiry-seconds 3600
      - name: Set image tag
        if: inputs.build_image
        id: image
        env:
          IMAGE_REGISTRY_TYPE: ${{ inputs.image_registry_type }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
        run: |
          set -euo pipefail
          if [[ "$IMAGE_REGISTRY_TYPE" == GHCR ]]; then
            host=ghcr.io
          else
            host=registry.digitalocean.com
          fi
          echo "tag=$host/$IMAGE_REGISTRY/$IMAGE_REPOSITORY:app-platform-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: inputs.build_image
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push Linux AMD64 image
        if: inputs.build_image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: app/${{ inputs.build_context }}
          file: app/${{ inputs.dockerfile_path }}
          target: ${{ inputs.build_target }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ inputs.image_repository }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=${{ inputs.image_repository }}
      - name: Verify public GitHub image can be pulled anonymously
        if: inputs.build_image && inputs.image_registry_type == 'GHCR'
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE_TAG%:*}@$IMAGE_DIGEST"
      - name: Pin the built image digest in the app spec
        if: inputs.build_image
        working-directory: app
        env:
          APP_SPEC_PATH: ${{ inputs.app_spec_path }}
          SOURCE_REVISION_POLICY: ${{ inputs.source_revision_policy }}
          DEPLOY_REF: ${{ inputs.deploy_ref }}
          IMAGE_REGISTRY_TYPE: ${{ inputs.image_registry_type }}
          IMAGE_REGISTRY: ${{ inputs.image_registry }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          INFISICAL_IDENTITY_ID: ${{ inputs.infisical_identity_id }}
        run: ruby ../shared/scripts/app_platform.rb render-image .
      - name: Resolve Infisical secret references
        if: inputs.infisical_identity_id != ''
        working-directory: app
        env:
          APP_SPEC_PATH: ${{ inputs.app_spec_path }}
          INFISICAL_IDENTITY_ID: ${{ inputs.infisical_identity_id }}
        run: ruby ../shared/scripts/app_platform.rb render-secrets .
      - name: Validate with DigitalOcean and inspect current app
        working-directory: app
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_SPEC_PATH: ${{ inputs.app_spec_path }}
          BEFORE_JSON: ${{ runner.temp }}/do-app-before.json
        run: |
          set -euo pipefail
          # This workflow updates an existing app. The generic spec validator
          # treats encrypted EV[...] secrets as invalid for a *new* app.
          doctl apps propose --app "$APP_ID" --spec "$APP_SPEC_PATH"
          doctl apps get "$APP_ID" -o json > "$BEFORE_JSON"
          ruby ../shared/scripts/app_platform.rb preflight . "$BEFORE_JSON"
      - name: Update app and wait for deployment
        working-directory: app
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_SPEC_PATH: ${{ inputs.app_spec_path }}
        run: |
          set -euo pipefail
          doctl apps update "$APP_ID" --spec "$APP_SPEC_PATH" --update-sources --wait
      - name: Verify active deployment
        id: verify
        working-directory: app
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_SPEC_PATH: ${{ inputs.app_spec_path }}
          SOURCE_REVISION_POLICY: ${{ inputs.source_revision_policy }}
          REQUIRE_IMAGE_DIGESTS: ${{ inputs.require_image_digests }}
          BEFORE_JSON: ${{ runner.temp }}/do-app-before.json
          AFTER_JSON: ${{ runner.temp }}/do-app-after.json
        run: |
          set -euo pipefail
          doctl apps get "$APP_ID" -o json > "$AFTER_JSON"
          ruby ../shared/scripts/app_platform.rb verify . "$BEFORE_JSON" "$AFTER_JSON"
      - name: Check public HTTPS endpoint
        if: inputs.healthcheck_url != ''
        env:
          HEALTHCHECK_URL: ${{ inputs.healthcheck_url }}
          HEALTHCHECK_ATTEMPTS: ${{ inputs.healthcheck_attempts }}
          HEALTHCHECK_INTERVAL_SECONDS: ${{ inputs.healthcheck_interval_seconds }}
          HEALTHCHECK_TIMEOUT_SECONDS: ${{ inputs.healthcheck_timeout_seconds }}
        run: ruby shared/scripts/app_platform.rb healthcheck
      - name: Show app console link after failure
        if: failure()
        env:
          APP_ID: ${{ inputs.app_id }}
        run: echo "::error::Inspect the app at https://cloud.digitalocean.com/apps/$APP_ID"
